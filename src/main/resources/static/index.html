<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>在线考试系统</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 14px/1.6 -apple-system, "Microsoft YaHei", sans-serif; background: #f4f6f9; color: #222; }
        .hidden { display: none !important; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; background: #1f2d3d; color: #fff; }
        .topbar h1 { font-size: 16px; margin: 0; }
        .wrap { max-width: 1080px; margin: 20px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .card h3 { margin: 0 0 12px; font-size: 15px; border-left: 3px solid #2d8cf0; padding-left: 8px; }
        input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #d3d9e2; border-radius: 4px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #2d8cf0; }
        button { font: inherit; padding: 6px 14px; border: none; border-radius: 4px; background: #2d8cf0; color: #fff; cursor: pointer; }
        button.ghost { background: #eef1f6; color: #333; }
        button.danger { background: #ed4014; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eef1f6; font-size: 13px; }
        th { color: #666; font-weight: 500; }
        .login { max-width: 360px; margin: 80px auto; }
        .login input { display: block; width: 100%; margin-bottom: 12px; }
        .hint { color: #999; font-size: 12px; margin: 8px 0 0; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .row > label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .q { padding: 14px 0; border-bottom: 1px dashed #e5e9f0; }
        .q:last-child { border-bottom: none; }
        .q .qh { margin-bottom: 8px; }
        .q em { color: #999; font-style: normal; font-size: 12px; }
        .opt { display: block; padding: 4px 0; cursor: pointer; }
        .opt input { margin-right: 6px; }
        .ans { width: 100%; min-height: 70px; }
        .sticky { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; }
        .timer { font-weight: 600; color: #2d8cf0; }
        .timer.warn { color: #ed4014; }
        .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #eef1f6; color: #666; }
        .badge.ok { background: #e8f7ee; color: #19a15f; }
        .badge.draft { background: #fff4e5; color: #d97706; }
        .fixed { position: fixed; right: 16px; bottom: 16px; }
        .toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 6px; z-index: 99; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .modal .box { background: #fff; border-radius: 8px; padding: 20px; width: 640px; max-height: 80vh; overflow: auto; }
        .ok { color: #19a15f; }
        .no { color: #ed4014; }
        .pending { color: #d97706; }
    </style>
</head>
<body>

<div class="topbar">
    <h1>在线考试系统</h1>
    <div id="userBox" class="hidden row">
        <span id="userInfo"></span>
        <button class="ghost" onclick="logout()">退出</button>
    </div>
</div>

<div class="wrap">

    <!-- 登录 -->
    <div id="loginView" class="card login">
        <h3>登录</h3>
        <input id="username" placeholder="用户名" value="teacher1">
        <input id="password" type="password" placeholder="密码" value="123456">
        <button style="width:100%" onclick="login()">登 录</button>
        <p class="hint">演示账号：teacher1（教师）/ student1（学生），密码均为 123456</p>
    </div>

    <!-- 主界面 -->
    <div id="mainView" class="hidden">
        <div class="card row">
            <label>课程 <select id="courseSelect" onchange="onCourseChange()"></select></label>
            <span class="hint" id="roleHint"></span>
        </div>

        <!-- 学生 -->
        <div id="studentPanel" class="hidden">
            <div class="card">
                <h3>可参加的考试</h3>
                <table>
                    <thead><tr><th>ID</th><th>试卷</th><th>时长</th><th>考试时间窗</th><th>操作</th></tr></thead>
                    <tbody id="examBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 教师 -->
        <div id="teacherPanel" class="hidden">
            <div class="card">
                <h3>组卷并发布</h3>
                <div class="row">
                    <label>标题 <input id="pTitle" value="Java 期中考试" style="width:180px"></label>
                    <label>时长(分钟) <input id="pDuration" type="number" value="60" style="width:80px"></label>
                    <label>开始 <input id="pStart" type="datetime-local"></label>
                    <label>结束 <input id="pEnd" type="datetime-local"></label>
                </div>
                <div class="row" style="margin-top:10px">
                    <label>单选 <input id="n1" type="number" value="1" min="0" style="width:60px"></label>
                    <label>多选 <input id="n2" type="number" value="1" min="0" style="width:60px"></label>
                    <label>判断 <input id="n3" type="number" value="1" min="0" style="width:60px"></label>
                    <label>主观 <input id="n4" type="number" value="1" min="0" style="width:60px"></label>
                    <button onclick="createPaper()">随机组卷</button>
                    <span class="hint">抽题按题型，难度不限；题量不足会直接报错</span>
                </div>
            </div>

            <div class="card">
                <h3>试卷列表</h3>
                <table>
                    <thead><tr><th>ID</th><th>标题</th><th>方式</th><th>总分</th><th>状态</th><th>时间窗</th><th>操作</th></tr></thead>
                    <tbody id="paperBody"></tbody>
                </table>
            </div>

            <div id="statCard" class="card hidden">
                <h3>统计 <span id="statTitle" class="hint"></span></h3>
                <div id="statSummary"></div>
                <div id="statQuestions" style="margin-top:12px"></div>
                <div style="margin-top:12px"><button class="ghost" onclick="downloadCsv()">导出 CSV</button></div>
            </div>

            <div id="sheetCard" class="card hidden">
                <h3>答卷 <span id="sheetTitle" class="hint"></span></h3>
                <table>
                    <thead><tr><th>答卷ID</th><th>学生ID</th><th>状态</th><th>总分</th><th>交卷时间</th><th>操作</th></tr></thead>
                    <tbody id="sheetBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 答题 -->
    <div id="answerView" class="hidden">
        <div class="card sticky">
            <b id="paperTitle"></b>
            <span class="timer" id="timer"></span>
            <button class="ghost" onclick="saveAnswers(true)">暂存</button>
            <button class="danger" onclick="submitPaper()">交卷</button>
        </div>
        <div id="questionList" class="card"></div>
    </div>

    <!-- 成绩 -->
    <div id="resultView" class="hidden">
        <div class="card">
            <h3>成绩</h3>
            <div id="resultSummary"></div>
            <div id="resultDetail" style="margin-top:12px"></div>
            <div style="margin-top:14px"><button class="ghost" onclick="backHome()">返回</button></div>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="box" id="modalBox"></div>
    </div>
</div>

<script>
    // ---------------- 基础 ----------------
    const S = {token: localStorage.getItem('token') || '', role: '', uid: null,
               courses: [], sheet: null, answers: {}, paperId: null, statPaperId: null};
    let timerId = null, saveTimer = null;

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
        c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    const fmt = t => t ? String(t).replace('T', ' ').slice(0, 16) : '-';

    async function api(path, method = 'GET', body) {
        const headers = {'Content-Type': 'application/json'};
        if (S.token) headers['Authorization'] = S.token;
        const res = await fetch('/api' + path, {
            method, headers, body: body === undefined ? undefined : JSON.stringify(body)
        });
        const json = await res.json().catch(() => ({code: -1, msg: 'HTTP ' + res.status}));
        if (json.code !== 0) throw new Error(json.msg || '请求失败');
        return json.data;
    }

    function toast(msg, ms = 1600) {
        const d = document.createElement('div');
        d.className = 'toast';
        d.textContent = msg;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), ms);
    }

    // ---------------- 登录 ----------------
    async function login() {
        try {
            const d = await api('/auth/login', 'POST',
                {username: $('username').value.trim(), password: $('password').value});
            S.token = d.token; S.role = d.role; S.uid = d.uid;
            localStorage.setItem('token', d.token);
            localStorage.setItem('role', d.role);
            enterMain();
        } catch (e) {
            alert(e.message);
        }
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    async function enterMain() {
        $('loginView').classList.add('hidden');
        $('mainView').classList.remove('hidden');
        $('userBox').classList.remove('hidden');
        $('userInfo').textContent = (S.role === 'TEACHER' ? '教师' : '学生') + ' · uid=' + S.uid;
        $('roleHint').textContent = S.role === 'TEACHER' ? '教师端' : '学生端';
        $('studentPanel').classList.toggle('hidden', S.role !== 'STUDENT');
        $('teacherPanel').classList.toggle('hidden', S.role !== 'TEACHER');

        try {
            S.courses = await api('/common/courses');
        } catch (e) {
            toast(e.message); return;
        }
        $('courseSelect').innerHTML = S.courses.map(c =>
            `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        onCourseChange();
    }

    function onCourseChange() {
        if (S.role === 'STUDENT') loadExams();
        else { loadPapers(); hideStat(); hideSheets(); }
    }

    // ---------------- 学生 ----------------
    async function loadExams() {
        try {
            const list = await api('/student/papers?courseId=' + $('courseSelect').value);
            $('examBody').innerHTML = list.length ? list.map(p => `<tr>
                <td>${p.id}</td><td>${esc(p.title)}</td><td>${p.durationMinutes} 分钟</td>
                <td>${fmt(p.startTime)} ~ ${fmt(p.endTime)}</td>
                <td><button onclick="startExam(${p.id}, '${esc(p.title)}')">进入考试</button></td>
            </tr>`).join('') : '<tr><td colspan="5" class="hint">暂无可参加的考试</td></tr>';
        } catch (e) {
            toast(e.message);
        }
    }

    async function startExam(paperId, title) {
        try {
            const s = await api(`/student/papers/${paperId}/start`, 'POST');
            if (s.status !== 1) {
                toast('该场考试已交卷，查看成绩');
                return openResult(s.sheetId);
            }
            const data = await api('/student/sheets/' + s.sheetId);
            S.sheet = data;
            S.answers = {};
            data.questions.forEach(q => { if (q.myAnswer) S.answers[q.questionId] = q.myAnswer; });
            $('paperTitle').textContent = title;
            $('mainView').classList.add('hidden');
            $('answerView').classList.remove('hidden');
            renderQuestions(data.questions);
            startTimer(data.remainSeconds);
        } catch (e) {
            alert(e.message);
        }
    }

    function renderQuestions(questions) {
        const typeName = {1: '单选', 2: '多选', 3: '判断', 4: '主观'};
        $('questionList').innerHTML = questions.map((q, i) => {
            let input;
            if (q.type === 4) {
                input = `<textarea class="ans" oninput="onAnswer(${q.questionId}, this.value)">${esc(q.myAnswer)}</textarea>`;
            } else if (q.type === 2) {
                const mine = (q.myAnswer || '').split(',');
                input = q.options.map(o => `<label class="opt">
                    <input type="checkbox" value="${o.optKey}" data-qid="${q.questionId}"
                           ${mine.includes(o.optKey) ? 'checked' : ''}
                           onchange="onMulti(${q.questionId})">${o.optKey}. ${esc(o.content)}</label>`).join('');
            } else {
                input = q.options.map(o => `<label class="opt">
                    <input type="radio" name="q${q.questionId}" value="${o.optKey}"
                           ${q.myAnswer === o.optKey ? 'checked' : ''}
                           onchange="onAnswer(${q.questionId}, '${o.optKey}')">${o.optKey}. ${esc(o.content)}</label>`).join('');
            }
            return `<div class="q">
                <div class="qh"><b>${i + 1}.</b> <span class="badge">${typeName[q.type]}</span>
                    ${esc(q.content)} <em>(${q.score} 分)</em></div>
                ${input}
            </div>`;
        }).join('');
    }

    function onAnswer(qid, value) {
        S.answers[qid] = value;
        queueSave();
    }

    function onMulti(qid) {
        const checked = [...document.querySelectorAll(`input[type=checkbox][onchange="onMulti(${qid})"]:checked`)]
            .map(c => c.value).sort();
        S.answers[qid] = checked.join(',');
        queueSave();
    }

    function queueSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => saveAnswers(false), 800);
    }

    async function saveAnswers(manual) {
        if (!S.sheet) return;
        try {
            await api(`/student/sheets/${S.sheet.sheetId}/save`, 'POST', S.answers);
            if (manual) toast('已暂存');
        } catch (e) {
            if (manual) toast(e.message);
        }
    }

    function startTimer(seconds) {
        clearInterval(timerId);
        let left = seconds;
        const el = $('timer');
        const tick = () => {
            el.textContent = `剩余 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
            el.classList.toggle('warn', left < 300);
            if (left <= 0) {
                clearInterval(timerId);
                toast('时间到，自动交卷');
                doSubmit();
            }
            left--;
        };
        tick();
        timerId = setInterval(tick, 1000);
        window.onbeforeunload = () => '考试进行中，确定离开？';
    }

    async function submitPaper() {
        if (!confirm('确定交卷？交卷后不能修改答案。')) return;
        await saveAnswers(false);
        await doSubmit();
    }

    async function doSubmit() {
        try {
            const r = await api(`/student/sheets/${S.sheet.sheetId}/submit`, 'POST');
            clearInterval(timerId);
            window.onbeforeunload = null;
            $('answerView').classList.add('hidden');
            if (r.hasSubjective) {
                toast(`交卷成功，客观题 ${r.objectiveScore} 分，主观题待老师批改`, 2400);
            } else {
                toast(`交卷成功，得分 ${r.totalScore}`, 2000);
            }
            openResult(S.sheet.sheetId);
        } catch (e) {
            alert(e.message);
        }
    }

    async function openResult(sheetId) {
        try {
            const r = await api('/student/sheets/' + sheetId + '/result');
            $('mainView').classList.add('hidden');
            $('answerView').classList.add('hidden');
            $('resultView').classList.remove('hidden');

            $('resultSummary').innerHTML = `
                <div class="row" style="font-size:15px">
                    <span>总分 <b style="font-size:22px;color:#2d8cf0">${r.totalScore}</b></span>
                    <span class="hint">客观 ${r.objectiveScore} · 主观 ${r.subjectiveScore}</span>
                    ${r.overtime ? '<span class="badge draft">超时交卷</span>' : ''}
                    ${r.status === 2 ? '<span class="badge draft">主观题待批改</span>' : '<span class="badge ok">已批改</span>'}
                </div>`;

            $('resultDetail').innerHTML = r.details.map((d, i) => {
                const mark = d.isCorrect === 1 ? '<span class="ok">✔ 正确</span>'
                    : d.isCorrect === 0 ? '<span class="no">✘ 错误</span>'
                        : '<span class="pending">待批改</span>';
                return `<div class="q">
                    <div class="qh"><b>${i + 1}.</b> ${esc(d.content)} <em>(${d.score}/${d.fullScore} 分)</em> ${mark}</div>
                    <div class="hint">我的答案：${esc(d.myAnswer) || '（未作答）'}</div>
                    ${d.isCorrect === 0 ? `<div class="hint">正确答案：${esc(d.correctAnswer)}</div>` : ''}
                </div>`;
            }).join('');
        } catch (e) {
            alert(e.message);
        }
    }

    function backHome() {
        $('resultView').classList.add('hidden');
        $('mainView').classList.remove('hidden');
        if (S.role === 'STUDENT') loadExams();
    }

    // ---------------- 教师 ----------------
    async function loadPapers() {
        try {
            const list = await api('/teacher/papers?courseId=' + $('courseSelect').value);
            $('paperBody').innerHTML = list.length ? list.map(p => `<tr>
                <td>${p.id}</td><td>${esc(p.title)}</td><td>${p.mode}</td><td>${p.totalScore}</td>
                <td>${p.status === 1 ? '<span class="badge ok">已发布</span>' : '<span class="badge draft">草稿</span>'}</td>
                <td>${fmt(p.startTime)} ~ ${fmt(p.endTime)}</td>
                <td>
                    ${p.status === 0 ? `<button onclick="publishPaper(${p.id})">发布</button> ` : ''}
                    <button class="ghost" onclick="showStats(${p.id}, '${esc(p.title)}')">统计</button>
                    <button class="ghost" onclick="showSheets(${p.id}, '${esc(p.title)}')">答卷</button>
                </td></tr>`).join('') : '<tr><td colspan="7" class="hint">还没有试卷</td></tr>';
        } catch (e) {
            toast(e.message);
        }
    }

    async function createPaper() {
        const toLocal = v => v ? v.replace('T', ' ') + ':00' : '';
        const start = $('pStart').value, end = $('pEnd').value;
        if (!start || !end) return alert('请选择考试开始和结束时间');

        const rules = [];
        [[1, 'n1'], [2, 'n2'], [3, 'n3'], [4, 'n4']].forEach(([type, id]) => {
            const n = parseInt($(id).value || '0', 10);
            if (n > 0) rules.push({type, difficulty: 0, count: n});
        });
        if (!rules.length) return alert('至少抽一道题');

        try {
            const id = await api('/teacher/papers', 'POST', {
                courseId: +$('courseSelect').value,
                title: $('pTitle').value,
                mode: 'RANDOM',
                durationMinutes: +$('pDuration').value,
                startTime: toLocal(start),
                endTime: toLocal(end),
                rules
            });
            toast('组卷成功，试卷 ID = ' + id);
            loadPapers();
        } catch (e) {
            alert(e.message);
        }
    }

    async function publishPaper(id) {
        if (!confirm('发布后学生即可参加，确定？')) return;
        try {
            await api(`/teacher/papers/${id}/publish`, 'POST');
            toast('已发布');
            loadPapers();
        } catch (e) {
            alert(e.message);
        }
    }

    async function showStats(paperId, title) {
        try {
            const o = await api(`/teacher/papers/${paperId}/stats`);
            const qs = await api(`/teacher/papers/${paperId}/stats/question`);
            S.statPaperId = paperId;
            $('statCard').classList.remove('hidden');
            $('statTitle').textContent = '· ' + title;
            $('statSummary').innerHTML = `
                <div class="row">
                    <span>答卷数 <b>${o.sheet_count}</b></span>
                    <span>平均分 <b>${o.avg_score}</b></span>
                    <span>最高 / 最低 <b>${o.max_score} / ${o.min_score}</b></span>
                    <span>及格线 <b>${o.passLine}</b></span>
                    <span>及格人数 <b>${o.pass_count}</b></span>
                </div>`;
            $('statQuestions').innerHTML = qs.length ? `<table>
                <thead><tr><th>题目</th><th>作答</th><th>答对</th><th>正确率</th></tr></thead>
                <tbody>${qs.map(q => `<tr><td>${esc(q.content)}</td><td>${q.total}</td>
                    <td>${q.correct}</td><td>${q.rate}%</td></tr>`).join('')}</tbody></table>` : '';
        } catch (e) {
            alert(e.message);
        }
    }

    function hideStat() { $('statCard').classList.add('hidden'); }
    function hideSheets() { $('sheetCard').classList.add('hidden'); }

    async function showSheets(paperId, title) {
        try {
            const list = await api(`/teacher/papers/${paperId}/sheets`);
            $('sheetCard').classList.remove('hidden');
            $('sheetTitle').textContent = '· ' + title;
            $('sheetBody').innerHTML = list.length ? list.map(s => `<tr>
                <td>${s.sheetId}</td><td>${s.studentId}</td>
                <td>${s.status === 3 ? '已批改' : s.status === 2 ? '待批改' : '作答中'}</td>
                <td>${s.totalScore}</td><td>${fmt(s.submitTime)}</td>
                <td>${s.status === 2 ? `<button onclick="openGrade(${s.sheetId})">批改</button>` : ''}</td>
            </tr>`).join('') : '<tr><td colspan="6" class="hint">暂无答卷</td></tr>';
        } catch (e) {
            alert(e.message);
        }
    }

    async function openGrade(sheetId) {
        try {
            const items = await api(`/teacher/sheets/${sheetId}/subjective`);
            if (!items.length) return alert('这份答卷没有待批改的主观题');
            $('modalBox').innerHTML = `<h3>批改答卷 #${sheetId}</h3>
                ${items.map(it => `<div class="q">
                    <div class="qh"><b>${esc(it.content)}</b> <em>(满分 ${it.fullScore})</em></div>
                    <div class="hint">参考答案：${esc(it.reference)}</div>
                    <div style="margin:6px 0;padding:8px;background:#f7f9fc;border-radius:4px">${esc(it.studentAnswer) || '（未作答）'}</div>
                    <label>给分 <input type="number" min="0" max="${it.fullScore}"
                        value="${it.fullScore}" data-qid="${it.questionId}" style="width:80px"></label>
                </div>`).join('')}
                <div class="row" style="margin-top:14px">
                    <button onclick="submitGrade(${sheetId})">提交批改</button>
                    <button class="ghost" onclick="closeModal()">取消</button>
                </div>`;
            $('modal').classList.remove('hidden');
        } catch (e) {
            alert(e.message);
        }
    }

    async function submitGrade(sheetId) {
        const scores = {};
        document.querySelectorAll('#modalBox input[data-qid]').forEach(i => {
            scores[i.dataset.qid] = +i.value;
        });
        try {
            const r = await api(`/teacher/sheets/${sheetId}/grade`, 'POST', scores);
            closeModal();
            toast(`批改完成，总分 ${r.totalScore}`);
            loadPapers();
        } catch (e) {
            alert(e.message);
        }
    }

    function closeModal() {
        $('modal').classList.add('hidden');
    }

    async function downloadCsv() {
        if (!S.statPaperId) return;
        const res = await fetch(`/api/teacher/papers/${S.statPaperId}/stats.csv`,
            {headers: {'Authorization': S.token}});
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `paper-${S.statPaperId}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // ---------------- 启动 ----------------
    (async function boot() {
        const t = localStorage.getItem('token'), r = localStorage.getItem('role');
        if (!t) return;
        S.token = t; S.role = r;
        // token 可能已过期，先用一个轻接口探一下
        try {
            await api('/common/courses');
            const payload = JSON.parse(atob(t.split('.')[0].replace(/-/g, '+').replace(/_/g, '/')));
            S.uid = payload.uid; S.role = payload.role;
            enterMain();
        } catch (e) {
            localStorage.clear();
        }
    })();
</script>
</body>
</html>
